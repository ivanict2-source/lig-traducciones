# Programas de afiliación candidatos.
#
# Ningún dato contractual está verificado en una fuente primaria: los términos
# oficiales no pudieron descargarse desde el entorno (bloqueo de red) y las cifras
# proceden de agregadores de terceros (fiabilidad baja). Antes de solicitar el
# alta hay que leer los T&C oficiales y preguntar por escrito al gestor de
# afiliados los puntos de `confirm_with_program`.
#
# evidence: verificado | comunicado-comercial | agregador | desconocido

common_questions: &q
  - "¿Aceptan afiliados (persona física o empresa) residentes en República Dominicana? ¿Qué KYC exigen?"
  - "¿Qué mercados/marcas están disponibles para el afiliado (Colombia, Perú, México)?"
  - "Tipo y tasa de comisión (RevShare / CPA / híbrido), umbral de calificación del CPA y periodo de retención."
  - "¿Existe arrastre de saldo negativo (negative carryover)? ¿Cuota administrativa?"
  - "Pago mínimo, frecuencia, métodos disponibles hacia RD (transferencia, Skrill, Neteller...) y moneda."
  - "Duración de la cookie / ventana de atribución y si admiten sub-ID por página."
  - "Restricciones de marca (bidding, uso del logotipo), material creativo aprobado y requisitos regulatorios por país (p. ej. leyenda 'Autorizado por COLJUEGOS')."
  - "Cláusulas de terminación, inactividad y retención de comisiones."

programs:
  - id: codere-partners
    name: Codere Partners
    brands_markets: "Codere (España, LatAm según el propio programa)"
    commission: { models: [revshare, cpa, hibrido], rates: "a petición", evidence: agregador }
    payment: { min: "200 EUR", frequency: mensual, methods: "transferencia, Neteller, Skrill, PayPal", evidence: agregador }
    negative_carryover: { value: "no", evidence: agregador }
    dominican_affiliates: { value: desconocido, evidence: desconocido }
    apply_url: null
    source_ids: [statsdrone-codere]
    confirm_with_program: *q

  - id: betsson-group-affiliates
    name: Betsson Group Affiliates
