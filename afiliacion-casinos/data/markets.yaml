  - code: DO
    country: República Dominicana
    language: es-DO
    regulatory_status: "Nueva Ley 86-26 (oct. 2026) crea la Dirección General de Juegos de Azar e incluye juego por internet; reglamentación pendiente."
    official_sources: [rd-ley-86-26]
    regulator_registry: null
