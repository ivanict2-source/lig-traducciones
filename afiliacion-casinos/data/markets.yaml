    monetization: "Limitada: prohibida la publicidad pública de bonos e incentivos, también por afiliados."
    legal_risk: media
    affiliate_obligations: "No promocionar sitios no registrados; sin incentivos en publicidad pública; posible registro del afiliado ante la AGCO (confirmar)."
    priority: 3

  - code: UK
    country: Reino Unido
    language: en-GB
