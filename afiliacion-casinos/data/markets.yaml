# Matriz de mercados (2026-10-20).
# Escalas: competencia / oportunidad_seo / dificultad / riesgo_legal = baja | media | alta
# Las valoraciones de competencia y oportunidad SEO son CUALITATIVAS: no se
# dispuso de herramientas de volumen de búsqueda (el conector de Ahrefs/Similarweb
# no conectó en la sesión). Deben recalibrarse con Search Console y Keyword
# Planner antes de invertir. Prioridad: 1 = MVP, 2 = siguiente, 3 = condicionada, X = excluido.

markets:
  - code: CO
    country: Colombia
    language: es-CO
    regulatory_status: "Regulado desde 2016. Operadores online con contrato de concesión de Coljuegos. Régimen publicitario (Res. 20231000019054 de 2023) parcialmente suspendido por el Consejo de Estado en junio de 2026."
    official_sources: [coljuegos-operadores-online, coljuegos-15-operadores, coljuegos-como-ser-operador]
    regulator_registry: https://www.coljuegos.gov.co/publicaciones/301841/juegosonline/
    competition: alta
    seo_opportunity: media
    entry_difficulty: media
    authorized_operators: "15 según Coljuegos (mayo de 2026)"
    monetization: "Probable: varios operadores con programas de afiliados conocidos (Betsson, Codere, RushBet, Betano, bwin). Condiciones por confirmar."
    legal_risk: media
    affiliate_obligations: "La normativa publicitaria de 2023 alcanza a terceros que publicitan por cuenta del operador; uso de la leyenda 'Autorizado por COLJUEGOS'; prohibido sugerir gratuidad o prometer ganancias."
    priority: 1
    notes: "Registro oficial con número de contrato: permite un diferencial de verificación transparente."

  - code: PE
    country: Perú
    language: es-PE
    regulatory_status: "Regulado por la Ley 31557 y el DS 005-2023-MINCETUR desde el 10-02-2024. Bloqueo activo de plataformas no autorizadas en 2026."
    official_sources: [mincetur-faq-ley-31557, mincetur-inicio-registro, ds-005-2023-mincetur, elperuano-bloqueo-2026]
    regulator_registry: https://apuestasdeportivas.mincetur.gob.pe/
    competition: media
    seo_opportunity: media-alta
    entry_difficulty: media
    authorized_operators: "No verificado (cifras contradictorias en prensa: >90 licencias vs 54 casinos)."
    monetization: "Probable (RushBet, Stake y otros autorizados según prensa). Programas por confirmar."
    legal_risk: media
    affiliate_obligations: "Publicidad solo de plataformas autorizadas por MINCETUR; advertencia obligatoria sobre ludopatía; sin dirigirse a menores."
    priority: 1
    notes: "Mercado regulado más reciente: menos contenido consolidado sobre 'cómo verificar' y cambios normativos."

  - code: MX
    country: México
    language: es-MX
    regulatory_status: "Permisos de SEGOB vinculados a permisionarios; nueva ley en preparación (sep. 2026); IEPS al 50 % desde 2026 según prensa."
    official_sources: [mx-reforma-2026, sigma-mx-reforma]
    regulator_registry: null
    competition: alta
    seo_opportunity: media
    entry_difficulty: alta
    authorized_operators: "Sin registro público consolidado verificado."
    monetization: "Alta potencialmente, pero la verificación de permisos es más difícil."
    legal_risk: media-alta
    affiliate_obligations: "Por determinar con la nueva ley."
    priority: 2
    notes: "Activar solo cuando exista registro público verificable o asesoría local."

  - code: ES
    country: España
    language: es-ES
    regulatory_status: "Regulado (Ley 13/2011, DGOJ). RD 958/2020 alcanza expresamente a afiliados; el TS anuló varios artículos en 2024."
    official_sources: [boe-rd-958-2020, dgoj-faq-afiliados, ts-rd958-2024]
    regulator_registry: https://www.ordenacionjuego.es/operadores-juego/operadores-licencia
    competition: alta
    seo_opportunity: baja
    entry_difficulty: alta
    authorized_operators: "Lista oficial DGOJ (no descargada)."
    monetization: "Madura y muy competida."
    legal_risk: media
    affiliate_obligations: "Comprobar título habilitante del anunciante; reglas de contenido y de bonos del RD 958/2020 vigentes tras la sentencia."
    priority: 3
    notes: "Mercado saturado por portales consolidados; no compensa como primer mercado."

  - code: AR
    country: Argentina
    language: es-AR
    regulatory_status: "Mosaico provincial (~20 de 24 jurisdicciones regulan); proyecto nacional en el Senado (mayo 2026)."
    official_sources: [canal26-argentina]
    regulator_registry: null
    competition: media
    seo_opportunity: media
    entry_difficulty: alta
    authorized_operators: "Por provincia."
    monetization: "Fragmentada por provincia."
    legal_risk: alta
    affiliate_obligations: "Varía por provincia; propuestas de restricción publicitaria."
    priority: 3
    notes: "Requiere segmentación provincial y asesoría local."

  - code: BR
    country: Brasil
    language: pt-BR
    regulatory_status: "Régimen de licencias federal (Lei 14.790/2023); Portaria SPA/MF 1.231/2024 regula publicidad y afiliados."
    official_sources: [spa-portaria-1231]
    regulator_registry: null
    competition: alta
    seo_opportunity: media
    entry_difficulty: alta
    authorized_operators: "Lista oficial SPA (no consultada)."
    monetization: "Mercado grande, pero exige contrato escrito en portugués y responsabilidad compartida."
    legal_risk: alta
    affiliate_obligations: "Art. 22 Portaria 1.231: afiliados como parte del marketing del operador; contratos en portugués; sanciones de la Ley 14.790."
    priority: 3
    notes: "Requiere idioma portugués y revisión legal especializada."

  - code: CA-ON
    country: Canadá (Ontario)
    language: en-CA
    regulatory_status: "Regulado (AGCO / iGaming Ontario)."
