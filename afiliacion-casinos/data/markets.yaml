    legal_risk: media
    affiliate_obligations: "Cumplimiento CAP/BCAP y condiciones contractuales del operador."
    priority: 3

  - code: US
    country: Estados Unidos (estados regulados)
    language: en-US
    regulatory_status: "Estado por estado; afiliados sujetos a registro de proveedor o licencia auxiliar según modelo de comisión (p. ej. Nueva Jersey)."
