# Operadores por mercado.
#
# REGLAS (aplicadas por scripts/validate_content.py y por la web):
# - Solo se muestran en producción operadores con verification.status == "verificado-humano".
# - "fuente-oficial-indirecta": aparece en una página del regulador, pero la
#   lectura se hizo a través de resultados de búsqueda (no se pudo abrir la página).
# - "prensa": solo hay respaldo de prensa o del propio operador.
# - official_url: null mientras no se confirme el dominio en la fuente oficial.
#   NUNCA se rellena por suposición.
# - affiliate.url: null hasta que exista un acuerdo firmado con el programa.
#
# Fecha de la última revisión automática: 2026-10-20

