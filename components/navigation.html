            <script defer="" data-name="navigation-logic">
              document.addEventListener('DOMContentLoaded', function() {
                (function(){
                  const mobileToggle = document.getElementById("mobile-toggle")
                  const mobileClose = document.getElementById("mobile-close")
                  const mobileMenu = document.getElementById("mobile-menu")
                  const body = document.body

                  const openMenu = () => {
                    mobileMenu.showModal()
                    mobileToggle.setAttribute("aria-expanded", "true")
                    body.style.overflow = "hidden"
                  }

                  const closeMenu = () => {
                    mobileMenu.close()
                    mobileToggle.setAttribute("aria-expanded", "false")
                    body.style.overflow = ""
                  }

                  mobileToggle.addEventListener("click", openMenu)
                  mobileClose.addEventListener("click", closeMenu)

                  // Close when clicking backdrop
                  mobileMenu.addEventListener("click", (e) => {
                    if (e.target === mobileMenu) {
                      closeMenu()
                    }
                  })

                  // Close when clicking a link (for single-page navigation)
                  const mobileLinks = mobileMenu.querySelectorAll(".navigation-mobile-link")
                  mobileLinks.forEach((link) => {
                    link.addEventListener("click", closeMenu)
                  })

                  // Handle window resize
                  window.addEventListener("resize", () => {
                    if (window.innerWidth > 767 && mobileMenu.open) {
                      closeMenu()
                    }
                  })
                })()
              });
            </script>
          </div>
        </div>
